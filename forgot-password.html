<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Forgot password · Six Star POS</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f766e" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
</head>
<body>
  <div class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo"><span class="logo-mark" id="logo-mark"></span><span id="app-name">Six Star POS</span></div>
      <h1 id="page-title">Forgot password?</h1>
      <p class="auth-subtitle" id="page-sub">Enter the email on your account and we’ll send you a reset link.</p>
      <div id="form-alert-slot"></div>
      <div class="tabs" style="margin-bottom: var(--space-5)">
        <button class="tab-btn active" data-kind="password" type="button">Password</button>
        <button class="tab-btn" data-kind="pin" type="button">Employee PIN</button>
      </div>
      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="identifier" id="id-label">Account email</label>
          <input class="input" type="email" id="identifier" placeholder="you@business.com" required autocomplete="email" autocapitalize="off" />
          <span class="field-hint" id="kind-hint">The reset link is sent to the email saved on your account.</span>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="forgot-btn">Send reset link</button>
      </form>
      <div id="sent" class="hidden">
        <div class="form-alert form-alert-success"><span>If an account with that email exists, a reset link is on its way. It expires in 30 minutes. Check your spam folder too.</span></div>
        <button type="button" class="btn btn-block" id="again-btn" style="margin-top:var(--space-4)">Use a different email</button>
      </div>
      <div class="auth-footer"><a href="login.html">Back to log in</a></div>
    </div>
  </div>
  <script src="js/core/config.js"></script>
  <script src="js/core/icons.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/pages/forgot-password.js"></script>
</body>
</html>
