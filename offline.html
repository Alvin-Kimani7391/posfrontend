<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Offline · Six Star POS</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <style>
    :root { color-scheme: light dark; --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#475569; --line:#e2e8f0; --brand:#0f766e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0b1220; --card:#111a2e; --text:#e5edf9; --muted:#9fb0c8; --line:#22304a; --brand:#14b8a6; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom));
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.5;
    }
    main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; text-align: center; }
    img { width: 64px; height: 64px; border-radius: 14px; }
    h1 { font-size: 1.35rem; margin: 16px 0 8px; }
    p { margin: 0 0 20px; color: var(--muted); }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    button, a.btn {
      min-height: 46px; padding: 0 18px; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
    }
    button.primary { background: var(--brand); color: #fff; border: 0; }
    a.btn { background: transparent; color: var(--text); border: 1px solid var(--line); }
    button:focus-visible, a.btn:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
    #status { margin-top: 16px; min-height: 1.4em; font-size: .9rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="" width="64" height="64" />
    <h1>You're offline</h1>
    <p>Six Star POS needs a connection to load this page. Check your Wi-Fi or mobile data, then try again.</p>
    <div class="actions">
      <button class="primary" id="retry" type="button">Try again</button>
      <a class="btn" href="dashboard.html">Open dashboard</a>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    (function () {
      var status = document.getElementById('status');
      function retry() {
        status.textContent = 'Checking connection…';
        fetch(location.href, { cache: 'no-store' })
          .then(function (r) { if (r.ok) location.reload(); else status.textContent = 'Still offline.'; })
          .catch(function () { status.textContent = 'Still offline.'; });
      }
      document.getElementById('retry').addEventListener('click', retry);
      window.addEventListener('online', function () { location.reload(); });
    })();
  </script>
</body>
</html>
