<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<meta name="robots" content="noindex,nofollow">
<title>Menu</title>
<style>
:root{
  --ink:#1c1917;--ink2:#44403c;--mut:#78716c;--line:#e7e5e4;--bg:#faf9f7;--card:#fff;
  --brand:#b45309;--brand-d:#92400e;--brand-l:#fef3c7;--ok:#15803d;--ok-l:#dcfce7;--bad:#b91c1c;--bad-l:#fee2e2;
  --r:16px;--sh:0 1px 2px rgba(28,25,23,.06),0 4px 14px rgba(28,25,23,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:128px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;padding-bottom:110px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

.hero{background:linear-gradient(160deg,#1c1917 0%,#292524 60%,#3b2a1a 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 0 56px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(217,119,6,.35),transparent 70%)}
.hero .row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.logo{width:60px;height:60px;border-radius:16px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:26px;flex:none;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.logo img{width:100%;height:100%;object-fit:cover}
.hero h1{margin:0;font-size:22px;letter-spacing:-.2px;line-height:1.15}
.hero .sub{color:#d6d3d1;font-size:13px;margin-top:3px}
.place{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:7px 13px;border-radius:99px;font-weight:600;font-size:14px;position:relative;z-index:1}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.dot.off{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.25)}
.welcome{margin:12px 0 0;color:#e7e5e4;font-size:14px;position:relative;z-index:1}
.help{position:absolute;right:16px;top:0;z-index:2;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;padding:9px 14px;border-radius:99px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.help[hidden]{display:none}

.tools{margin-top:-30px;position:relative;z-index:3}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;box-shadow:var(--sh);padding:0 14px;border:1px solid var(--line)}
.search input{flex:1;border:0;outline:0;padding:14px 0;background:transparent;min-width:0}
.search svg{flex:none;color:var(--mut)}
.tabs{position:sticky;top:0;z-index:20;background:rgba(250,249,247,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:14px}
.tabs[hidden]{display:none}
.tabs .in{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;max-width:820px;margin:0 auto}
.tabs .in::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.note{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:13px 14px;margin:16px 0 0;font-size:14px}
.note.warn{background:var(--brand-l);border:1px solid #fde68a;color:#78350f}
.note b{display:block;margin-bottom:2px}
.note button{margin-top:8px;background:var(--brand);color:#fff;padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px}

.cat{margin:26px 0 10px;font-size:19px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:baseline;gap:8px}
.cat small{font-weight:500;color:var(--mut);font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;gap:12px;text-align:left;width:100%;box-shadow:var(--sh);position:relative;transition:transform .12s}
.item:active{transform:scale(.985)}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.item h3{margin:0;font-size:15.5px;line-height:1.25}
.item p{margin:5px 0 0;color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .ft{margin-top:auto;padding-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.price{font-weight:800;color:var(--brand-d)}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--brand-l);color:#92400e}
.tag.red{background:var(--bad-l);color:var(--bad)}
.tag.gr{background:var(--ok-l);color:var(--ok)}
.pic{width:104px;height:104px;border-radius:12px;flex:none;position:relative;overflow:hidden;background:linear-gradient(135deg,#fde68a,#fdba74);display:grid;place-items:center;font-size:34px;font-weight:800;color:rgba(124,45,18,.55)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plus{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--brand-d);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:22px;font-weight:600;line-height:1;z-index:2}
.item.out{opacity:.55}.item.out .pic img{filter:grayscale(1)}

.sk{background:linear-gradient(90deg,#efedea 25%,#f7f5f3 37%,#efedea 63%);background-size:400% 100%;animation:sk 1.3s infinite;border-radius:12px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.empty .big{font-size:42px}
.errbox{max-width:460px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 24px;text-align:center;box-shadow:var(--sh)}
.errbox .big{font-size:44px}.errbox h2{margin:10px 0 6px}.errbox p{color:var(--mut);margin:0 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;border-radius:13px;padding:14px 20px;font-weight:700;min-height:48px}
.btn:active{background:var(--brand-d)}.btn:disabled{opacity:.5}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}

.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(250,249,247,.96) 35%);pointer-events:none}
.cartbar:empty{display:none}
.cartbar>*{pointer-events:auto;max-width:788px;margin:0 auto;display:flex}
.cartbtn{width:100%;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;border-radius:16px;padding:15px 18px;font-weight:700;box-shadow:0 8px 24px rgba(28,25,23,.35)}
.cartbtn .n{background:var(--brand);border-radius:99px;min-width:26px;height:26px;display:inline-grid;place-items:center;padding:0 8px;font-size:13px;margin-right:10px}

.ov{position:fixed;inset:0;background:rgba(28,25,23,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1);overflow:hidden}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.sheet .hd{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet .hd h2{margin:0;font-size:18px}
.x{width:36px;height:36px;border-radius:50%;background:#f5f5f4;font-size:20px;line-height:1;flex:none}
.sheet .bd{padding:0 18px 12px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet .fx{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;background:#fff;align-items:center}
.hero-img{height:190px;margin:0 -18px 14px;position:relative;background:linear-gradient(135deg,#fde68a,#fdba74);display:grid;place-items:center;font-size:56px;font-weight:800;color:rgba(124,45,18,.45)}
.hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grp{margin:16px 0 0}
.grp h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grp h4 em{font-style:normal;font-size:11px;font-weight:700;background:#f5f5f4;color:var(--ink2);padding:3px 8px;border-radius:99px}
.grp h4 em.req{background:var(--brand-l);color:#92400e}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--brand);background:#fffbeb;box-shadow:0 0 0 1px var(--brand) inset}
.opt input{accent-color:var(--brand);width:19px;height:19px;flex:none}
.opt span.n{flex:1}.opt span.p{color:var(--mut);font-size:13px;font-weight:600}
.field{width:100%;padding:13px 14px;border:1px solid #d6d3d1;border-radius:12px;background:#fff;margin-top:8px;outline:0}
.field:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(180,83,9,.15)}
.lbl{font-size:12px;font-weight:700;color:var(--ink2);margin:14px 0 0;display:block}
.qty{display:inline-flex;align-items:center;background:#f5f5f4;border-radius:99px;padding:3px}
.qty button{width:36px;height:36px;border-radius:50%;background:#fff;font-size:20px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.qty b{min-width:34px;text-align:center}
.line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.line .t{flex:1;min-width:0}.line .t small{display:block;color:var(--mut);font-size:12.5px}
.line .pp{font-weight:700;white-space:nowrap}
.tot{display:flex;justify-content:space-between;padding:12px 0 2px;font-size:17px;font-weight:800}
.fine{color:var(--mut);font-size:12.5px;margin:4px 0 0}
.ctx{background:var(--brand-l);border:1px solid #fde68a;color:#78350f;border-radius:12px;padding:10px 12px;font-weight:600;font-size:13.5px;margin:2px 0 6px}
.ok-ring{width:84px;height:84px;border-radius:50%;background:var(--ok-l);display:grid;place-items:center;margin:14px auto 12px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.ok-ring svg{stroke:var(--ok)}
.center{text-align:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;z-index:80;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw}
.toast.bad{background:var(--bad)}
.opts{display:grid;gap:10px;margin-top:6px}
.opts button{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:600}
.opts button small{display:block;color:var(--mut);font-weight:400}
.opts .ic{font-size:24px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:30px 0 10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="hero"><div class="wrap" style="position:relative">
  <button class="help" id="helpBtn" hidden>🔔 <span id="helpTxt">Call</span></button>
  <div class="row"><div class="logo" id="logo">·</div><div style="min-width:0;padding-right:96px"><h1 id="bn">Loading…</h1><div class="sub" id="br"></div></div></div>
  <div id="placeWrap"></div><p class="welcome" id="welcome" hidden></p>
</div></header>
<div class="wrap tools"><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search the menu" autocomplete="off" aria-label="Search the menu"></label></div>
<div class="tabs" id="tabs" hidden><div class="in" id="tabsIn"></div></div>
<main class="wrap" id="app"><div style="padding-top:18px"><div class="sk" style="height:26px;width:40%;margin-bottom:14px"></div><div class="grid"><div class="sk" style="height:128px"></div><div class="sk" style="height:128px"></div><div class="sk" style="height:128px"></div><div class="sk" style="height:128px"></div></div></div></main>
<footer id="foot"></footer>
<div class="cartbar" id="cartbar"></div>
<div id="layer"></div>

<script src="/js/core/config.js"></script>
<script>
(function () {
'use strict';
var API = ((window.APP_CONFIG && window.APP_CONFIG.API_BASE_URL) || 'https://posbackend-5jaq.onrender.com/api/v1') + '/public/qr/';
var token = decodeURIComponent((location.pathname.split('/q/')[1] || new URLSearchParams(location.search).get('t') || '').split('/')[0].split('?')[0]);
var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var CK = 'q.cart.' + token.slice(0, 40), GK = 'q.guest';
var ctx = null, menu = null, cart = [], query = '', pin = '', guest = { name: '', phone: '' }, sending = false, clientRef = null;
try { cart = JSON.parse(sessionStorage.getItem(CK) || '[]'); } catch (e) { cart = []; }
try { guest = Object.assign(guest, JSON.parse(localStorage.getItem(GK) || '{}')); } catch (e) { /* ignore */ }
function saveCart() { try { sessionStorage.setItem(CK, JSON.stringify(cart)); } catch (e) { /* ignore */ } }
function saveGuest() { try { localStorage.setItem(GK, JSON.stringify(guest)); } catch (e) { /* ignore */ } }

function cur() { return (ctx && ctx.business && ctx.business.currency) || 'KES'; }
function money(n) { try { return new Intl.NumberFormat('en-KE', { style: 'currency', currency: cur(), maximumFractionDigits: 2, minimumFractionDigits: (n % 1 ? 2 : 0) }).format(n || 0); } catch (e) { return cur() + ' ' + (n || 0); } }
function showPrices() { return !ctx || !ctx.options || ctx.options.showPrices !== false; }
function iconOf(n) { return E(String(n || '?').trim().charAt(0).toUpperCase()); }

async function call(path, method, body) {
  var r;
  try { r = await fetch(API + token + path, { method: method || 'GET', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { var er = new Error('No connection. Please check your internet and try again.'); er.code = 'NETWORK'; throw er; }
  var j = await r.json().catch(function () { return {}; });
  if (!r.ok || j.success === false) { var er2 = new Error(j.message || 'Something went wrong. Please try again.'); er2.code = j.code || ('HTTP_' + r.status); er2.status = r.status; throw er2; }
  return j.data;
}

var tt;
function toast(msg, bad) { $$('.toast').forEach(function (x) { x.remove(); }); var d = document.createElement('div'); d.className = 'toast' + (bad ? ' bad' : ''); d.setAttribute('role', 'status'); d.textContent = msg; document.body.appendChild(d); clearTimeout(tt); tt = setTimeout(function () { d.remove(); }, 3200); }

function sheet(html, onMount) {
  closeSheet();
  var o = document.createElement('div'); o.className = 'ov'; o.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  o.addEventListener('mousedown', function (e) { if (e.target === o) closeSheet(); });
  $('#layer').appendChild(o); document.body.style.overflow = 'hidden';
  $$('[data-close]', o).forEach(function (b) { b.addEventListener('click', closeSheet); });
  if (onMount) onMount(o);
  return o;
}
function closeSheet() { $('#layer').innerHTML = ''; document.body.style.overflow = ''; }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

var REASON = {
  MENU_ONLY: ['Browse the menu', 'Ordering from your phone is not switched on here. Please call a waiter to order.'],
  TABLE_NOT_OPEN: ['Your table is not open yet', 'A waiter needs to seat you before you can order from your phone. Tap the button to let them know.'],
  ROOM_NOT_OCCUPIED: ['Ordering opens after check-in', 'Once you are checked in, you can order to your room from here.'],
  OFF: ['Browse the menu', 'Ordering from your phone is not available. Please call a waiter.']
};
async function init() {
  if (!token) return fail({ message: 'This link is incomplete. Please scan the QR code on your table or room again.', code: 'NO_TOKEN' });
  try {
    ctx = await call('');
    var mp = call('/menu');
    paintHero();
    menu = await mp;
    cart = cart.filter(function (c) { return c && c.menuItemId; }); saveCart();
    paintTabs(); paintMenu(); paintBar();
  } catch (e) { fail(e); }
}
function fail(e) {
  $('#bn').textContent = 'Menu'; $('#tabs').hidden = true; $('.tools').style.display = 'none';
  var net = e.code === 'NETWORK';
  $('#app').innerHTML = '<div class="errbox"><div class="big">' + (net ? '📡' : '🍽️') + '</div><h2>' + (net ? 'You are offline' : 'We could not open this menu') + '</h2><p>' + E(e.message) + (net ? '' : '<br>Please ask a member of staff for help.') + '</p>' +
    '<button class="btn" id="retry">Try again</button>' + (e.code && !net ? '<div class="fine" style="margin-top:14px">Code: ' + E(e.code) + '</div>' : '') + '</div>';
  $('#retry').onclick = function () { location.reload(); };
}

function paintHero() {
  var b = ctx.business || {}; document.title = (b.name || 'Menu') + ' · Menu';
  $('#bn').textContent = b.name || 'Menu';
  $('#br').textContent = [ctx.branch, b.phone].filter(Boolean).join(' · ');
  var lg = $('#logo'); if (b.logo) { lg.innerHTML = '<img alt="" src="' + E(b.logo) + '">'; lg.firstChild.onerror = function () { lg.textContent = String(b.name || '?').charAt(0).toUpperCase(); }; } else lg.textContent = String(b.name || '?').charAt(0).toUpperCase();
  var pl = ctx.place || {}, room = pl.kind === 'ROOM';
  $('#placeWrap').innerHTML = '<div class="place"><span class="dot ' + (ctx.canOrder ? '' : 'off') + '"></span>' + (room ? '🛏️ ' : '🍽️ ') + E(pl.label || '') + (ctx.guest && ctx.guest.firstName ? ' · Hi ' + E(ctx.guest.firstName) : '') + '</div>';
  if (ctx.welcome) { var w = $('#welcome'); w.hidden = false; w.textContent = ctx.welcome; }
  $('#helpBtn').hidden = false; $('#helpTxt').textContent = room ? 'Reception' : 'Call waiter';
  $('#helpBtn').onclick = helpSheet;
  $('#foot').textContent = (b.name || '') + (ctx.room && ctx.room.roomServiceHours ? ' · Room service ' + ctx.room.roomServiceHours : '');
}

function itemsOf() { return ((menu && menu.categories) || []).filter(function (c) { return c.items && c.items.length; }); }
function fromPrice(it) {
  if (it.price != null) return { v: it.price, from: false };
  var vs = (it.variants || []).map(function (v) { return v.price != null ? v.price : null; }).filter(function (x) { return x != null; });
  return vs.length ? { v: Math.min.apply(null, vs), from: true } : null;
}
function paintTabs() {
  var cats = itemsOf(); var t = $('#tabs');
  t.hidden = cats.length < 2 || !!query;
  $('#tabsIn').innerHTML = cats.map(function (c, i) { return '<button class="chip' + (i === 0 ? ' on' : '') + '" data-c="' + i + '">' + E(c.name) + '</button>'; }).join('');
  $$('[data-c]', t).forEach(function (b) { b.addEventListener('click', function () { var el = $('#cat' + b.dataset.c); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }); });
}
function card(it) {
  var out = it.available === false, p = fromPrice(it), canAdd = ctx.canOrder && !out, tags = [];
  if (out) tags.push('<span class="tag red">' + (it.unavailableReason === 'OUT_OF_STOCK' ? 'Sold out' : 'Unavailable') + '</span>');
  if (it.promoLabel) tags.push('<span class="tag">' + E(it.promoLabel) + '</span>');
  if (it.isCombo) tags.push('<span class="tag gr">Combo</span>');
  var price = showPrices() ? (p ? '<span class="price">' + (p.from ? 'From ' : '') + money(p.v) + '</span>' : '<span class="price">Choose size</span>') : '';
  return '<button class="item' + (out ? ' out' : '') + '" data-i="' + E(it.id) + '"><div class="tx"><h3>' + E(it.name) + '</h3>' + (it.description ? '<p>' + E(it.description) + '</p>' : '') +
    '<div class="ft">' + price + tags.join('') + '</div></div>' +
    '<div class="pic"><span>' + iconOf(it.name) + '</span>' + (it.image ? '<img src="' + E(it.image) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + (canAdd ? '<span class="plus" aria-hidden="true">+</span>' : '') + '</div></button>';
}
function paintMenu() {
  var app = $('#app'), cats = itemsOf(), q = query.trim().toLowerCase(), html = '';
  if (!ctx.canOrder) {
    var r = REASON[ctx.reason] || REASON.OFF;
    html += '<div class="note warn"><div style="font-size:22px">ℹ️</div><div><b>' + r[0] + '</b>' + r[1] + (ctx.reason === 'TABLE_NOT_OPEN' ? '<br><button id="seatMe">Call a waiter</button>' : '') + '</div></div>';
  }
  var shown = cats.map(function (c) { return { c: c, items: q ? c.items.filter(function (i) { return (i.name + ' ' + (i.description || '')).toLowerCase().indexOf(q) >= 0; }) : c.items }; }).filter(function (x) { return x.items.length; });
  if (!cats.length) html += '<div class="empty"><div class="big">🍳</div><h3>The menu is being prepared</h3><p>Please ask a member of staff.</p></div>';
  else if (!shown.length) html += '<div class="empty"><div class="big">🔎</div><h3>No dishes match “' + E(query) + '”</h3><p>Try a different word.</p></div>';
  else html += shown.map(function (x, i) { return '<section id="cat' + i + '" data-sec="' + i + '"><h2 class="cat">' + E(x.c.name) + ' <small>' + x.items.length + '</small></h2><div class="grid">' + x.items.map(card).join('') + '</div></section>'; }).join('');
  app.innerHTML = html;
  $$('[data-i]', app).forEach(function (b) { b.addEventListener('click', function () { openItem(findItem(b.dataset.i)); }); });
  var sm = $('#seatMe'); if (sm) sm.onclick = function () { sendCall('WAITER'); };
  spy();
}
function findItem(id) { var all = []; itemsOf().forEach(function (c) { all = all.concat(c.items); }); return all.find(function (i) { return String(i.id) === String(id); }); }
var io;
function spy() {
  if (io) io.disconnect(); if (!('IntersectionObserver' in window) || query) return;
  io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { var i = e.target.dataset.sec; $$('#tabsIn .chip').forEach(function (c) { c.classList.toggle('on', c.dataset.c === i); }); var on = $('#tabsIn .chip.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' }); } }); }, { rootMargin: '-130px 0px -70% 0px' });
  $$('[data-sec]').forEach(function (s) { io.observe(s); });
}
var deb; $('#q').addEventListener('input', function (e) { clearTimeout(deb); deb = setTimeout(function () { query = e.target.value; paintTabs(); paintMenu(); }, 180); });

function unitOf(it, vid, mods) {
  var base = it.price;
  var v = (it.variants || []).find(function (x) { return String(x.id) === String(vid); });
  if (v) base = v.price != null ? v.price : (it.price || 0) + (v.priceDelta || 0);
  if (base == null) base = 0;
  return base + mods.reduce(function (a, m) { return a + (m.priceDelta || 0); }, 0);
}
function openItem(it) {
  if (!it) return;
  var vs = it.variants || [], gs = it.modifierGroups || [], can = ctx.canOrder && it.available !== false, qty = 1;
  var vHtml = vs.length ? '<div class="grp"><h4>Choose a size <em class="' + (it.requireVariant ? 'req' : '') + '">' + (it.requireVariant ? 'Required' : 'Optional') + '</em></h4>' +
    (!it.requireVariant ? '<label class="opt"><input type="radio" name="v" value="" checked><span class="n">Regular</span><span class="p">' + (showPrices() && it.price != null ? money(it.price) : '') + '</span></label>' : '') +
    vs.map(function (v, i) { return '<label class="opt"><input type="radio" name="v" value="' + E(v.id) + '"' + (it.requireVariant && i === 0 ? ' checked' : '') + '><span class="n">' + E(v.name) + '</span><span class="p">' + (showPrices() ? (v.price != null ? money(v.price) : v.priceDelta ? (v.priceDelta > 0 ? '+' : '') + money(v.priceDelta) : '') : '') + '</span></label>'; }).join('') + '</div>' : '';
  var gHtml = gs.map(function (g, gi) {
    var single = g.max === 1;
    return '<div class="grp"><h4>' + E(g.name) + ' <em class="' + (g.required ? 'req' : '') + '">' + (g.required ? 'Required' : 'Optional') + (g.max ? ' · up to ' + g.max : '') + '</em></h4>' + (g.options || []).map(function (o) {
      return '<label class="opt"><input type="' + (single ? 'radio' : 'checkbox') + '" name="g' + gi + '" data-g="' + gi + '" value="' + E(o.id) + '"><span class="n">' + E(o.name) + '</span><span class="p">' + (showPrices() && o.priceDelta ? '+' + money(o.priceDelta) : '') + '</span></label>';
    }).join('') + '</div>';
  }).join('');
  var aller = it.allergens && it.allergens.length ? '<p class="fine">Contains: ' + E(it.allergens.join(', ')) + '</p>' : '';
  var html = '<div class="bd" style="padding-top:0"><div class="hero-img"><span>' + iconOf(it.name) + '</span>' + (it.image ? '<img alt="" src="' + E(it.image) + '" onerror="this.remove()">' : '') + '<button class="x" data-close style="position:absolute;right:14px;top:14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)" aria-label="Close">×</button></div>' +
    '<h2 style="margin:0;font-size:21px">' + E(it.name) + '</h2>' + (it.description ? '<p style="color:var(--ink2);margin:6px 0 0">' + E(it.description) + '</p>' : '') + aller + vHtml + gHtml +
    (can && ctx.options.allowNotes !== false ? '<label class="lbl" for="nt">Special requests</label><input class="field" id="nt" maxlength="200" placeholder="e.g. no onions, extra spicy">' : '') + '</div>' +
    '<div class="fx">' + (can ? '<div class="qty"><button id="mn" aria-label="Less">−</button><b id="qn">1</b><button id="pl" aria-label="More">+</button></div><button class="btn" id="ok" style="flex:1"></button>' : '<button class="btn alt block" data-close>' + (it.available === false ? 'Not available right now' : 'Close') + '</button>') + '</div>';
  sheet(html, function (o) {
    if (!can) return;
    function sel() {
      var vEl = $('[name=v]:checked', o), v = vEl ? vEl.value : null, mods = [];
      gs.forEach(function (g, gi) { $$('[data-g="' + gi + '"]:checked', o).forEach(function (c) { var op = (g.options || []).find(function (x) { return String(x.id) === c.value; }); if (op) mods.push({ groupId: g.id, optionId: op.id, name: op.name, priceDelta: op.priceDelta || 0 }); }); });
      return { v: v, mods: mods };
    }
    function upd() { var s = sel(); $('#qn', o).textContent = qty; $('#ok', o).textContent = 'Add to order' + (showPrices() ? ' · ' + money(unitOf(it, s.v, s.mods) * qty) : ''); }
    o.addEventListener('change', upd); upd();
    $('#mn', o).onclick = function () { qty = Math.max(1, qty - 1); upd(); };
    $('#pl', o).onclick = function () { qty = Math.min((ctx.options && ctx.options.maxQuantityPerItem) || 20, qty + 1); upd(); };
    $('#ok', o).onclick = function () {
      var s = sel(), bad = '';
      gs.forEach(function (g) { var n = s.mods.filter(function (m) { return m.groupId === g.id; }).length; if (g.required && n < Math.max(1, g.min || 1)) bad = 'Please choose ' + g.name; else if (g.max && n > g.max) bad = g.name + ': choose at most ' + g.max; });
      if (it.requireVariant && !s.v) bad = 'Please choose a size';
      if (bad) return toast(bad, true);
      var nt = $('#nt', o) ? $('#nt', o).value.trim() : '';
      var vv = vs.find(function (x) { return String(x.id) === String(s.v); });
      var key = [it.id, s.v || '', s.mods.map(function (m) { return m.optionId; }).sort().join(','), nt].join('|');
      var ex = cart.find(function (c) { return c.key === key; });
      if (ex) ex.quantity += qty; else cart.push({ key: key, menuItemId: it.id, name: it.name, variantId: s.v || undefined, variantName: vv && vv.name, modifiers: s.mods, notes: nt, quantity: qty, unit: unitOf(it, s.v, s.mods) });
      saveCart(); closeSheet(); paintBar(); toast('Added to your order');
    };
  });
}

function count() { return cart.reduce(function (a, c) { return a + c.quantity; }, 0); }
function total() { return cart.reduce(function (a, c) { return a + (c.unit || 0) * c.quantity; }, 0); }
function paintBar() {
  var n = count(), b = $('#cartbar');
  b.innerHTML = n ? '<button class="cartbtn" id="vc"><span><span class="n">' + n + '</span>View your order</span><span>' + (showPrices() ? money(total()) : '') + '</span></button>' : '';
  if (n) $('#vc').onclick = cartSheet;
}
function cartSheet() {
  if (!cart.length) return closeSheet();
  var o = ctx.options || {}, place = (ctx.place && ctx.place.label) || '';
  var lines = cart.map(function (c, i) { return '<div class="line"><div class="t"><b>' + E(c.name) + '</b>' + (c.variantName ? '<small>' + E(c.variantName) + '</small>' : '') + (c.modifiers.length ? '<small>' + c.modifiers.map(function (m) { return E(m.name); }).join(', ') + '</small>' : '') + (c.notes ? '<small>“' + E(c.notes) + '”</small>' : '') +
    '<div class="qty" style="margin-top:8px"><button data-m="' + i + '" aria-label="Less">−</button><b>' + c.quantity + '</b><button data-p="' + i + '" aria-label="More">+</button></div></div>' + (showPrices() ? '<div class="pp">' + money(c.unit * c.quantity) + '</div>' : '') + '</div>'; }).join('');
  var html = '<div class="hd"><h2>Your order</h2><button class="x" data-close aria-label="Close">×</button></div><div class="bd">' +
    '<div class="ctx">📍 Ordering for ' + E(place) + '</div>' + lines +
    (showPrices() ? '<div class="tot"><span>Estimated total</span><span>' + money(total()) + '</span></div><p class="fine">The final amount is confirmed on your bill.</p>' : '') +
    '<label class="lbl" for="gn">Your name' + (o.requireName ? ' *' : ' (optional)') + '</label><input class="field" id="gn" autocomplete="name" value="' + E(guest.name) + '" style="margin-top:6px">' +
    '<label class="lbl" for="gp">Phone' + (o.requirePhone ? ' *' : ' (optional)') + '</label><input class="field" id="gp" type="tel" inputmode="tel" autocomplete="tel" value="' + E(guest.phone) + '" style="margin-top:6px">' +
    (ctx.needsPin ? '<label class="lbl" for="pn">Room PIN * <span style="font-weight:400;color:var(--mut)">(on your registration card)</span></label><input class="field" id="pn" type="password" inputmode="numeric" maxlength="8" value="' + E(pin) + '" style="margin-top:6px">' : '') +
    (o.allowNotes !== false ? '<label class="lbl" for="on">Note for the kitchen (optional)</label><textarea class="field" id="on" rows="2" maxlength="300" style="margin-top:6px"></textarea>' : '') + '</div>' +
    '<div class="fx"><button class="btn alt" data-close>Add more</button><button class="btn" id="go" style="flex:1">Place order</button></div>';
  sheet(html, function (el) {
    $$('[data-m]', el).forEach(function (b) { b.onclick = function () { var c = cart[+b.dataset.m]; if (--c.quantity <= 0) cart.splice(+b.dataset.m, 1); saveCart(); paintBar(); if (cart.length) cartSheet(); else closeSheet(); }; });
    $$('[data-p]', el).forEach(function (b) { b.onclick = function () { cart[+b.dataset.p].quantity++; saveCart(); paintBar(); cartSheet(); }; });
    $('#go', el).onclick = send;
  });
}
async function send() {
  if (sending) return; var o = ctx.options || {};
  guest = { name: $('#gn').value.trim(), phone: $('#gp').value.trim() }; if ($('#pn')) pin = $('#pn').value.trim(); saveGuest();
  if (o.requireName && !guest.name) return toast('Please enter your name', true);
  if (o.requirePhone && !guest.phone) return toast('Please enter your phone number', true);
  if (ctx.needsPin && !/^\d{4,8}$/.test(pin)) return toast('Enter your 4–8 digit room PIN', true);
  if (!clientRef) clientRef = 'q' + Date.now() + Math.random().toString(36).slice(2, 8);
  var body = { items: cart.map(function (c) { var i = { menuItemId: c.menuItemId, quantity: c.quantity }; if (c.variantId) i.variantId = c.variantId; if (c.modifiers.length) i.modifiers = c.modifiers.map(function (m) { return { groupId: m.groupId, optionId: m.optionId }; }); if (c.notes) i.notes = c.notes; return i; }), clientRef: clientRef };
  var g = {}; if (guest.name) g.name = guest.name; if (guest.phone) g.phone = guest.phone; if (Object.keys(g).length) body.guest = g;
  var note = $('#on') && $('#on').value.trim(); if (note) body.notes = note; if (ctx.needsPin && pin) body.pin = pin;
  var b = $('#go'); sending = true; b.disabled = true; b.textContent = 'Sending…';
  try {
    var r = await call('/orders', 'POST', body);
    var n = count(), est = r.estimatedTotal != null ? r.estimatedTotal : total();
    cart = []; clientRef = null; saveCart(); paintBar();
    var sent = r.status === 'AUTO_ACCEPTED' || r.status === 'ACCEPTED';
    sheet('<div class="bd center" style="padding-top:10px"><div class="ok-ring"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></div>' +
      '<h2 style="margin:0">' + (sent ? 'Order sent to the kitchen' : 'Order received') + '</h2><p style="color:var(--ink2);margin:8px 0 0">' + E(r.message || 'A member of staff will confirm it shortly.') + '</p>' +
      '<div class="ctx" style="margin-top:16px">' + n + ' item' + (n > 1 ? 's' : '') + ' · ' + E((ctx.place && ctx.place.label) || '') + (showPrices() && est ? ' · ' + money(est) : '') + '</div></div>' +
      '<div class="fx"><button class="btn block" data-close>Done</button></div>');
  } catch (e) { toast(e.message, true); b.disabled = false; b.textContent = 'Place order'; if (e.code === 'PIN_INVALID') pin = ''; }
  finally { sending = false; }
}

function helpSheet() {
  var room = ctx.place && ctx.place.kind === 'ROOM';
  var opts = room
    ? [['RECEPTION', '🛎️', 'Reception', 'Speak to the front desk'], ['WAITER', '🍽️', 'Room service', 'Ask about food and drinks'], ['CLEANING', '🧹', 'Cleaning', 'Request room cleaning'], ['MAINTENANCE', '🔧', 'Maintenance', 'Something needs fixing'], ['ASSISTANCE', '🙋', 'Other help', 'Anything else']]
    : [['WAITER', '🙋', 'Call a waiter', 'We will come to your table'], ['BILL', '🧾', 'Request the bill', 'Bring my bill please'], ['ASSISTANCE', '💬', 'Need assistance', 'Something else']];
  var allowBill = !ctx.options || ctx.options.allowBillRequest !== false;
  sheet('<div class="hd"><h2>How can we help?</h2><button class="x" data-close aria-label="Close">×</button></div><div class="bd"><div class="opts">' +
    opts.filter(function (x) { return x[0] !== 'BILL' || allowBill; }).map(function (x) { return '<button data-k="' + x[0] + '"><span class="ic">' + x[1] + '</span><span>' + x[2] + '<small>' + x[3] + '</small></span></button>'; }).join('') + '</div></div>', function (el) {
    $$('[data-k]', el).forEach(function (b) { b.onclick = function () { sendCall(b.dataset.k); }; });
  });
}
async function sendCall(kind) {
  try {
    if (ctx.needsPin && !pin) {
      return sheet('<div class="hd"><h2>Room PIN</h2><button class="x" data-close aria-label="Close">×</button></div><div class="bd"><p class="fine" style="margin:0 0 4px">Enter the PIN printed on your registration card.</p><input class="field" id="pn2" type="password" inputmode="numeric" maxlength="8"></div><div class="fx"><button class="btn block" id="pgo">Continue</button></div>', function (el) {
        $('#pgo', el).onclick = function () { var v = $('#pn2', el).value.trim(); if (!/^\d{4,8}$/.test(v)) return toast('Enter your 4–8 digit PIN', true); pin = v; sendCall(kind); };
      });
    }
    var body = { kind: kind }; if (guest.name) body.guestName = guest.name; if (ctx.needsPin && pin) body.pin = pin;

  } catch (e) { if (e.code === 'PIN_INVALID') pin = ''; toast(e.message, true); }
}

init();
})();
