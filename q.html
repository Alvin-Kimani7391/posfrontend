<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f6f5;color:#14201f;padding-bottom:90px}header{background:#0d2f2c;color:#fff;padding:20px}header h1{margin:0;font-size:20px}header p{margin:4px 0 0;color:#8fd8cf}
.c{padding:14px;max-width:720px;margin:auto}h2{margin:18px 0 8px}.it{background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid #e3e8e6}.it small{color:#5f6f6c}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:#0f766e;color:#fff;font-weight:600;min-height:44px}button.s{background:#e6f4f2;color:#0b5e58}button:disabled{opacity:.4}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e3e8e6;padding:12px;display:flex;gap:8px;justify-content:center}.m{background:#fff;border-radius:14px;padding:16px;margin:14px;text-align:center}input{font:inherit;padding:12px;border:1px solid #cfd8d5;border-radius:10px;width:100%;margin:6px 0}</style></head>
<body><header><h1 id="bn">Loading…</h1><p id="pl"></p></header><div class="c" id="c"></div><div class="bar" id="bar"></div>
<script>
(function(){const API='https://posbackend-5jaq.onrender.com/api/v1/public/qr/';const token=decodeURIComponent((location.pathname.split('/q/')[1]||new URLSearchParams(location.search).get('t')||'').split('/')[0]);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=s=>document.querySelector(s);let ctx,cart={},pin='';
const money=n=>new Intl.NumberFormat('en-KE',{style:'currency',currency:(ctx&&ctx.business.currency)||'KES'}).format(n||0);
async function call(p,method,body){const r=await fetch(API+token+p,{method:method||'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok||j.success===false)throw new Error(j.message||'Something went wrong');return j.data}
async function init(){try{ctx=await call('');$('#bn').textContent=ctx.business.name;$('#pl').textContent=(ctx.place&&ctx.place.label)||'';const m=await call('/menu');draw(m)}catch(e){$('#c').innerHTML='<div class="m"><h3>'+E(e.message)+'</h3></div>';$('#bn').textContent='Menu'}}
function draw(m){const can=ctx.canOrder;$('#c').innerHTML=(ctx.welcome?'<div class="m">'+E(ctx.welcome)+'</div>':'')+(!can?'<div class="m">'+({MENU_ONLY:'You can browse the menu. Please call a waiter to order.',TABLE_NOT_OPEN:'Ask a waiter to open your table to order here.',ROOM_NOT_OCCUPIED:'Ordering opens once you are checked in.'}[ctx.reason]||'Ordering is not available right now.')+'</div>':'')+m.categories.map(c=>'<h2>'+E(c.name)+'</h2>'+c.items.map(i=>'<div class="it"><div><b>'+E(i.name)+'</b><br><small>'+E(i.description||'')+'</small>'+(i.price!=null?'<br><b>'+money(i.price)+'</b>':'')+'</div>'+(can&&i.available?'<div><button class="s" data-m="'+i.id+'" data-d="-1">−</button> <b id="q'+i.id+'">'+(cart[i.id]||0)+'</b> <button data-m="'+i.id+'" data-d="1">+</button></div>':(i.available?'':'<small>Sold out</small>'))+'</div>').join('')).join('');
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const id=b.dataset.m;cart[id]=Math.max(0,(cart[id]||0)+ +b.dataset.d);$('#q'+id).textContent=cart[id];bar()});bar()}
function bar(){const n=Object.values(cart).reduce((a,b)=>a+b,0);const k=ctx.place&&ctx.place.kind;$('#bar').innerHTML=(n?'<button id="send">Send order ('+n+')</button>':'')+'<button class="s" id="call">Call waiter</button>'+(ctx.mode&&k==='TABLE'&&ctx.options&&ctx.options.allowBillRequest!==false?'<button class="s" id="bill">Ask for bill</button>':'');
if($('#send'))$('#send').onclick=send;$('#call').onclick=()=>ask('WAITER');if($('#bill'))$('#bill').onclick=()=>ask('BILL')}
async function pinFor(){if(ctx.needsPin&&!pin)pin=prompt('Enter your room PIN')||'';return pin}
async function send(){try{const p=await pinFor();const items=Object.entries(cart).filter(([,q])=>q>0).map(([menuItemId,quantity])=>({menuItemId,quantity}));await call('/orders','POST',{items,clientRef:String(Date.now()),...(p?{pin:p}:{})});cart={};alert('Order sent. A member of staff will confirm it shortly.');init()}catch(e){alert(e.message)}}
async function ask(kind){try{const p=await pinFor();await call('/calls','POST',{kind,...(p?{pin:p}:{})});alert('A member of staff has been notified.')}catch(e){alert(e.message)}}
init()})();
</script></body></html>
