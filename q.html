<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a26">
<meta name="robots" content="noindex,nofollow">
<title>Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
:root{
  --ink:#10201d;--ink2:#374844;--mut:#6b7c77;--line:#e4eae7;--bg:#f4f7f5;--card:#fff;
  --brand:#0f766e;--brand-d:#0b5c56;--brand-l:#e1f4f1;--deep:#0b2a26;--gold:#c8923a;--gold-l:#fbf1de;
  --ok:#15803d;--ok-l:#dcfce7;--bad:#b42318;--bad-l:#fee4e2;--warn:#b45309;--warn-l:#fef3c7;
  --r:18px;--sh:0 1px 2px rgba(16,32,29,.05),0 6px 20px rgba(16,32,29,.06);--nav:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.serif{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em}

/* hero */
.hero{background:radial-gradient(120% 140% at 100% 0%,#14544d 0%,var(--deep) 55%,#071a17 100%);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 0 64px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px)}
.hero .row{display:flex;align-items:center;gap:14px;position:relative}
.logo{width:56px;height:56px;border-radius:16px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:24px;flex:none;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.logo img{width:100%;height:100%;object-fit:cover}
.hero h1{font-size:23px;line-height:1.15}
.hero .sub{color:#b9d3cd;font-size:13px;margin-top:2px}
.chips{display:flex;flex-wrap:nowrap;gap:8px;margin:16px -16px 0;padding:0 16px;position:relative;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}.chips .pill{flex:none;white-space:nowrap;color:#fff;font-family:inherit;padding:6px 11px;font-size:13px;gap:6px}
.pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:7px 13px;border-radius:99px;font-weight:600;font-size:13.5px;backdrop-filter:blur(6px)}
.live{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:pulse 2s infinite}
.live.off{background:#fbbf24;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.welcome{margin:14px 0 0;color:#d5e7e3;font-size:14px;position:relative;max-width:46ch}

.pull{margin-top:-40px;position:relative;z-index:2}
.pull>.sec:first-child{color:#cfe3de}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card+.card{margin-top:14px}
.card h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.muted{color:var(--mut)}.fine{color:var(--mut);font-size:12.5px}
.sec{margin:22px 2px 10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}

/* buttons / fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--brand);color:#fff;border-radius:14px;padding:14px 20px;font-weight:700;min-height:50px;transition:transform .1s,background .15s}
.btn:active{transform:scale(.98);background:var(--brand-d)}.btn:disabled{opacity:.55}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.dark{background:var(--deep)}
.btn.gold{background:var(--gold);color:#2b1d05}
.btn.mpesa{background:#16a34a}.btn.mpesa:active{background:#15803d}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.field{width:100%;padding:14px;border:1px solid #cfd9d5;border-radius:13px;background:#fff;outline:0;margin-top:6px}
.field:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.lbl{font-size:12.5px;font-weight:600;color:var(--ink2);margin-top:14px;display:block}

/* search + tabs */
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:15px;box-shadow:var(--sh);padding:0 15px;border:1px solid var(--line)}
.search input{flex:1;border:0;outline:0;padding:15px 0;background:transparent;min-width:0}
.cats{position:sticky;top:0;z-index:20;background:rgba(244,247,245,.93);backdrop-filter:blur(10px);margin:12px -16px 0;border-bottom:1px solid var(--line)}
.cats .in{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.cats .in::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}

/* menu items */
.catt{margin:26px 0 12px;font-size:21px;display:flex;align-items:baseline;gap:8px}
.catt small{font:500 13px Inter;color:var(--mut)}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;gap:12px;text-align:left;width:100%;box-shadow:var(--sh);position:relative;transition:transform .12s}
.item:active{transform:scale(.985)}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.item h3{font-size:15.5px;line-height:1.25}
.item p{margin:5px 0 0;color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .ft{margin-top:auto;padding-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.price{font-weight:800;color:var(--brand-d)}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--gold-l);color:#8a5a12}
.tag.red{background:var(--bad-l);color:var(--bad)}.tag.gr{background:var(--ok-l);color:var(--ok)}.tag.bl{background:var(--brand-l);color:var(--brand-d)}
.pic{width:104px;height:104px;border-radius:14px;flex:none;position:relative;overflow:hidden;background:linear-gradient(135deg,#d3ece8,#f6e6c8);display:grid;place-items:center;color:rgba(11,42,38,.35)}
.pic svg{width:34px;height:34px}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plus{position:absolute;right:7px;bottom:7px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--brand-d);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.item.out{opacity:.55}.item.out .pic img{filter:grayscale(1)}

/* notices */
.note{display:flex;gap:12px;align-items:flex-start;border-radius:15px;padding:13px 14px;margin:16px 0 0;font-size:14px;background:var(--warn-l);border:1px solid #f6dfa0;color:#6b3f08}
.note b{display:block;margin-bottom:1px}.note.info{background:var(--brand-l);border-color:#bfe5df;color:#0b4a45}
.empty{text-align:center;padding:48px 18px;color:var(--mut)}
.empty .ring{width:68px;height:68px;border-radius:50%;background:var(--brand-l);color:var(--brand);display:grid;place-items:center;margin:0 auto 14px}
.empty .ring svg{width:30px;height:30px}.empty h3{color:var(--ink);margin-bottom:4px;font-size:17px}

/* bottom nav + cart bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:12px;font-size:11px;font-weight:600;color:var(--mut);position:relative}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--brand)}
.nav button.on:before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}
.nav .bd{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:99px;background:var(--gold);color:#2b1d05;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.cartbar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:39;padding:8px 16px}
.cartbar:empty{display:none}
.cartbtn{max-width:728px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--deep);color:#fff;border-radius:16px;padding:14px 18px;font-weight:700;box-shadow:0 10px 28px rgba(11,42,38,.4)}
.cartbtn .n{background:var(--gold);color:#2b1d05;border-radius:99px;min-width:26px;height:26px;display:inline-grid;place-items:center;padding:0 8px;font-size:13px;margin-right:10px}

/* sheets */
.ov{position:fixed;inset:0;background:rgba(7,26,23,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);overflow:hidden}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:24px;max-height:88vh}}
.sheet .hd{padding:18px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet .hd h2{font-size:19px}
.x{width:36px;height:36px;border-radius:50%;background:#eef2f0;display:grid;place-items:center;flex:none}
.sheet .bd{padding:4px 18px 14px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet .fx{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;background:#fff;align-items:center}
.himg{height:200px;margin:0 -18px 14px;position:relative;background:linear-gradient(135deg,#d3ece8,#f6e6c8);display:grid;place-items:center;color:rgba(11,42,38,.3)}
.himg svg{width:54px;height:54px}.himg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grp{margin:16px 0 0}.grp h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grp h4 em{font-style:normal;font-size:11px;font-weight:700;background:#eef2f0;color:var(--ink2);padding:3px 9px;border-radius:99px}
.grp h4 em.req{background:var(--gold-l);color:#8a5a12}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--brand);background:#f1faf8;box-shadow:0 0 0 1px var(--brand) inset}
.opt input{accent-color:var(--brand);width:19px;height:19px;flex:none}
.opt .n{flex:1}.opt .p{color:var(--mut);font-size:13px;font-weight:600}
.qty{display:inline-flex;align-items:center;background:#eef2f0;border-radius:99px;padding:3px}
.qty button{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14);display:grid;place-items:center}
.qty b{min-width:34px;text-align:center}
.line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.line .t{flex:1;min-width:0}.line .t small{display:block;color:var(--mut);font-size:12.5px}
.line .pp{font-weight:700;white-space:nowrap}
.tot{display:flex;justify-content:space-between;padding:7px 0 0;font-size:14.5px}
.tot.big{font-size:18px;font-weight:800;border-top:1px dashed #cdd8d4;margin-top:8px;padding-top:12px}
.ctx{display:flex;gap:8px;align-items:center;background:var(--brand-l);border:1px solid #bfe5df;color:#0b4a45;border-radius:13px;padding:10px 12px;font-weight:600;font-size:13.5px;margin:2px 0 6px}

/* order tracker */
.ord{padding:0;overflow:hidden}
.ord .top{padding:15px 16px 4px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ord .top b{font-size:16px}.ord .top small{color:var(--mut);display:block}
.badge{font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--brand-l);color:var(--brand-d);white-space:nowrap}
.badge.gr{background:var(--ok-l);color:var(--ok)}.badge.go{background:var(--gold-l);color:#8a5a12}.badge.rd{background:var(--bad-l);color:var(--bad)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);padding:16px 12px 6px;position:relative}
.step{text-align:center;position:relative;font-size:11.5px;font-weight:600;color:var(--mut)}

.wait{text-align:center;padding:10px 0 4px}

@keyframes pop{from{transform:scale(.3);opacity:0}}
.prog{height:5px;background:#e4eae7;border-radius:9px;overflow:hidden;margin:14px 0 0}.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width 1s linear}

  }
