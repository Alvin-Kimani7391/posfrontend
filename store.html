<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Order online</title>
<meta name="theme-color" content="#F26A21" id="themeMeta" />
<meta name="apple-mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-title" content="Order online" /><meta name="apple-mobile-web-app-status-bar-style" content="default" /><meta name="mobile-web-app-capable" content="yes" />
<meta name="robots" content="noindex,nofollow" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="icon" href="/icons/favicon-32.png" />
<link rel="manifest" href="/store.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
:root{--o:#F26A21;--od:#D9560F;--ol:#FFF1E8;--ink:#14171A;--ink2:#3B424A;--mut:#7A828A;--line:#ECEEF0;--bg:#F5F5F6;--card:#fff;--ok:#1F9D55;--okl:#E3F6EA;--blue:#3B82F6;--bluel:#E5EFFE;--bad:#D92D20;--badl:#FEE4E2;--warn:#B45309;--warnl:#FEF3C7;--r:16px;--sh:0 1px 2px rgba(20,23,26,.05),0 6px 18px rgba(20,23,26,.06);--nav:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:#e9eaec;color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
#app{max-width:480px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(0,0,0,.12)}
#view{padding-bottom:calc(var(--nav) + 28px + env(safe-area-inset-bottom))}
#view.nonav{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
#view.full{padding-bottom:0}
.pad{padding:0 16px}
.muted{color:var(--mut)}.fine{color:var(--mut);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.sp{height:14px}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line)}
.top h1{font-size:18px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.ib:active{background:#eef0f2}
.ib .dot{position:absolute;top:3px;right:2px;min-width:18px;height:18px;border-radius:99px;background:var(--o);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* buttons / fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--o);color:#fff;border-radius:14px;padding:14px 20px;font-weight:700;min-height:52px;transition:transform .1s,background .15s;width:100%}
.btn:active{transform:scale(.98);background:var(--od)}.btn:disabled{opacity:.55}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #cfd4d9}
.btn.dark{background:#111;color:#fff}.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;border-radius:12px;width:auto}
.btn.green{background:var(--ok)}.btn.line{background:var(--ol);color:var(--od)}
.field{width:100%;padding:14px;border:1px solid #d8dde1;border-radius:13px;background:#fff;outline:0;margin-top:6px}
.field:focus{border-color:var(--o);box-shadow:0 0 0 3px rgba(242,106,33,.15)}
.lbl{font-size:12.5px;font-weight:600;color:var(--ink2);margin-top:14px;display:block}
.phonef{display:flex;margin-top:6px;border:1px solid #d8dde1;border-radius:13px;background:#fff;overflow:hidden}
.phonef:focus-within{border-color:var(--o);box-shadow:0 0 0 3px rgba(242,106,33,.15)}
.phonef span{padding:0 12px;font-weight:700;color:var(--ink2);background:#f0f2f4;display:flex;align-items:center}
.phonef input{border:0;outline:0;padding:14px;flex:1;min-width:0;background:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card+.card{margin-top:12px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px;font-weight:700;font-size:16px}
.sec a,.sec button{font-size:13px;color:var(--o);font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--warnl);color:var(--warn)}
.tag.gr{background:var(--okl);color:var(--ok)}.tag.rd{background:var(--badl);color:var(--bad)}.tag.bl{background:var(--bluel);color:#1d4ed8}.tag.or{background:var(--ol);color:var(--od)}
.note{display:flex;gap:10px;border-radius:14px;padding:12px 14px;font-size:13.5px;background:var(--warnl);color:#6b3f08;margin-top:12px}
.note.info{background:var(--ol);color:#8a3a0c}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.empty{text-align:center;padding:44px 18px;color:var(--mut)}
.empty .ring{width:68px;height:68px;border-radius:50%;background:var(--ol);color:var(--o);display:grid;place-items:center;margin:0 auto 14px}
.empty .ring svg{width:30px;height:30px}.empty h3{color:var(--ink);font-size:17px;margin-bottom:4px}
.sk{background:linear-gradient(90deg,#e9ecee 25%,#f5f6f7 37%,#e9ecee 63%);background-size:400% 100%;animation:sk 1.3s infinite;border-radius:14px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.spin{width:22px;height:22px;border:3px solid rgba(242,106,33,.2);border-top-color:var(--o);border-radius:50%;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}

/* splash */
.splash{min-height:100vh;background:radial-gradient(120% 90% at 80% 10%,#7a3410 0%,#2a1408 45%,#0d0907 100%);color:#fff;display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));position:relative;overflow:hidden}
.splash:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 2px,transparent 2px 16px)}
.brand{display:flex;align-items:center;gap:12px;position:relative}
.brand .lg{width:52px;height:52px;border-radius:15px;background:var(--o);display:grid;place-items:center;font-weight:800;font-size:24px;overflow:hidden;flex:none;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.brand .lg img{width:100%;height:100%;object-fit:cover}
.brand b{font-size:21px;display:block;line-height:1.1}.brand small{color:#e0cfc4;font-size:13px}
.splash .art{flex:1;display:grid;place-items:center;position:relative}
.splash .art .plate{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb27d,#F26A21 55%,#9a3a08);display:grid;place-items:center;box-shadow:0 20px 60px rgba(242,106,33,.45)}
.splash .art .plate svg{width:84px;height:84px;stroke-width:1.4}
.splash h1{font-size:34px;line-height:1.1;font-weight:800;position:relative}.splash h1 em{font-style:normal;color:var(--o);display:block}
.splash p{color:#e0cfc4;margin:12px 0 22px;position:relative}
.splash .btn{margin-top:10px;position:relative}

/* home */
.hhead{background:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;border-bottom:1px solid var(--line)}
.hhead .brandrow{display:flex;align-items:center;gap:10px}
.hhead .lg{width:34px;height:34px;border-radius:10px;background:var(--o);color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}.hhead .lg img{width:100%;height:100%;object-fit:cover}
.hhead .bn{font-weight:800;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hhead h2{font-size:21px;margin-top:14px}.hhead p{color:var(--mut);font-size:13.5px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink2);text-align:center}
.qa .ico{width:56px;height:56px;border-radius:16px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);box-shadow:var(--sh)}
.qa .ico.on{background:var(--o);color:#fff;border-color:var(--o)}.qa .ico svg{width:25px;height:25px}
.hstrip{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}.hstrip::-webkit-scrollbar{display:none}
.mini{flex:none;width:118px;text-align:left}
.mini .im{width:118px;height:92px;border-radius:14px;background:linear-gradient(135deg,#fde2cf,#f7c9a6);position:relative;overflow:hidden;display:grid;place-items:center;color:rgba(138,58,12,.35)}
.mini .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mini b{display:block;font-size:13px;margin-top:6px;line-height:1.25}.mini span{font-size:12.5px;color:var(--mut)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .card{display:flex;gap:10px;align-items:center;padding:14px}
.stat .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--ol);color:var(--o);flex:none}
.stat small{display:block;color:var(--mut);font-size:12px}.stat b{font-size:15px}
.live{background:linear-gradient(135deg,var(--o),#ff8a4a);color:#fff;border-radius:var(--r);padding:16px;box-shadow:0 10px 24px rgba(242,106,33,.35)}
.live small{opacity:.9}.live b{font-size:17px}

/* chips + menu */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;background:var(--bg);position:sticky;top:calc(65px + env(safe-area-inset-top));z-index:20}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 15px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--o);color:#fff;border-color:var(--o)}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 14px;margin:12px 16px 0}
.search input{flex:1;border:0;outline:0;padding:13px 0;background:transparent;min-width:0}
.dish{display:flex;gap:12px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin:0 16px 12px;position:relative;text-align:left;width:calc(100% - 32px)}
.dish .im{width:92px;height:92px;border-radius:14px;flex:none;background:linear-gradient(135deg,#fde2cf,#f7c9a6);position:relative;overflow:hidden;display:grid;place-items:center;color:rgba(138,58,12,.35)}
.dish .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dish .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.dish h3{font-size:15px;line-height:1.25}.dish p{margin-top:3px;color:var(--mut);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dish .ft{margin-top:auto;padding-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.price{font-weight:800;color:var(--ink)}
.add{width:34px;height:34px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;position:absolute;right:12px;bottom:12px;box-shadow:0 4px 10px rgba(242,106,33,.4)}
.dish.out{opacity:.55}.dish.out .add{background:#c7ccd1;box-shadow:none}
.catt{margin:18px 16px 10px;font-size:17px;font-weight:700}

/* floating cart bar + nav */
.cartbar{position:fixed;left:50%;transform:translateX(-50%);width:min(480px,100%);bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:39;padding:8px 14px}
.cartbar.nonav{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.cartbtn{width:100%;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;font-weight:700;box-shadow:0 10px 28px rgba(20,23,26,.35)}
.cartbtn .cc{width:38px;height:38px;border-radius:12px;background:var(--o);display:grid;place-items:center}
.cartbtn .arrow{margin-left:auto}
.nav{position:fixed;left:50%;transform:translateX(-50%);width:min(480px,100%);bottom:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--mut);position:relative}
.nav button svg{width:23px;height:23px}.nav button.on{color:var(--o)}
.nav .bd{position:absolute;top:1px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:99px;background:var(--o);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* cart + totals */
.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border:0}.line .im{width:60px;height:60px;border-radius:12px;background:linear-gradient(135deg,#fde2cf,#f7c9a6);overflow:hidden;position:relative;flex:none}.line .im img{width:100%;height:100%;object-fit:cover}
.line .t{flex:1;min-width:0}.line .t small{display:block;color:var(--mut);font-size:12px}
.qty{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:99px;padding:3px 4px;background:#fff}
.qty button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--o);font-size:18px;font-weight:700}
.qty b{min-width:18px;text-align:center}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:14.5px;color:var(--ink2)}
.tot.big{font-size:18px;font-weight:800;color:var(--ink);border-top:1px dashed #d4d9dd;margin-top:8px;padding-top:12px}
.tot.big b:last-child{color:var(--o)}

/* sheets */
.ov{position:fixed;inset:0;touch-action:manipulation;background:rgba(10,12,14,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:min(480px,100%);max-height:92vh;max-height:92dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);overflow:hidden}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .hd{padding:18px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}.sheet .hd h2{font-size:19px}
.sheet .bd{padding:4px 18px 14px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet .fx{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.x{width:36px;height:36px;border-radius:50%;background:#eef0f2;display:grid;place-items:center;flex:none}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--o);background:var(--ol);box-shadow:0 0 0 1px var(--o) inset}
.opt input{accent-color:var(--o);width:19px;height:19px;flex:none}.opt .n{flex:1}.opt .p{color:var(--mut);font-size:13px;font-weight:600}
.grp h4{margin:16px 0 8px;font-size:14px}

/* payment */
.method{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px;cursor:pointer;width:100%;text-align:left}
.method .mi{width:40px;height:40px;border-radius:11px;background:#f0f2f4;display:grid;place-items:center;color:var(--ink2)}
.method.on{border-color:var(--o);background:var(--ol)}.method.on .mi{background:var(--ok);color:#fff}
.method .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid #cdd2d7;display:grid;place-items:center;color:#fff}
.method.on .ck{background:var(--o);border-color:var(--o)}
.okring{width:96px;height:96px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;margin:8px auto 16px;animation:pop .45s cubic-bezier(.2,1.4,.4,1);box-shadow:0 12px 30px rgba(242,106,33,.4)}
.okring svg{width:50px;height:50px;stroke-width:3}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.phone-anim{width:84px;height:84px;border-radius:26px;background:var(--okl);color:var(--ok);display:grid;place-items:center;margin:8px auto 14px;animation:ring 1.6s infinite}.phone-anim svg{width:40px;height:40px}
@keyframes ring{0%,100%{transform:rotate(0)}10%,30%{transform:rotate(-8deg)}20%,40%{transform:rotate(8deg)}50%{transform:rotate(0)}}
.prog{height:5px;background:#e4e8eb;border-radius:9px;overflow:hidden;margin:14px 0 0}.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width 1s linear}
.center{text-align:center}

/* order status */
.obanner{background:var(--o);color:#fff;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.obanner b{font-size:17px;display:block}.obanner small{opacity:.92}
.tl{position:relative;padding:4px 0 0}
.ts{display:flex;gap:14px;padding-bottom:22px;position:relative}
.ts:not(:last-child):before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:#dfe3e6}
.ts.done:not(:last-child):before{background:var(--ok)}
.ts .dot{width:32px;height:32px;border-radius:50%;background:#eceef0;color:#9aa2a9;display:grid;place-items:center;flex:none;position:relative;z-index:1}
.ts.done .dot{background:var(--ok);color:#fff}.ts.now .dot{background:var(--o);color:#fff;box-shadow:0 0 0 6px rgba(242,106,33,.18);animation:glow 1.8s infinite}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(242,106,33,.06)}}
.ts b{display:block;font-size:15px}.ts small{color:var(--mut)}.ts.todo b{color:var(--mut);font-weight:600}

/* floor */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 16px}
.tb{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 6px 10px;text-align:center;font-size:12.5px;position:relative}
.tb .sq{width:62px;height:62px;border-radius:14px;margin:0 auto 6px;display:grid;place-items:center;background:var(--okl);color:var(--ok);border:2px solid #b8e6c9}
.tb .sq svg{width:30px;height:30px}
.tb b{display:block;font-size:13.5px}.tb small{font-weight:600}
.tb.free small{color:var(--ok)}.tb.free:active{border-color:var(--o)}
.tb.busy .sq{background:var(--ol);color:var(--o);border-color:#fbc9a8}.tb.busy small{color:var(--od)}
.tb.rsv .sq{background:var(--bluel);color:var(--blue);border-color:#bcd3fb}.tb.rsv small{color:#1d4ed8}
.tb.small .sq{background:#f0f2f4;color:#9aa2a9;border-color:#e0e3e6}.tb.small small{color:var(--mut)}
.tb.sel{border-color:var(--o);box-shadow:0 0 0 2px rgba(242,106,33,.25)}
.legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--ink2);margin:16px 0 0}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

/* rooms */
.room{display:flex;gap:12px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin:0 16px 12px;text-align:left;width:calc(100% - 32px)}
.room .im{width:96px;height:96px;border-radius:12px;background:linear-gradient(135deg,#dfe6ee,#c9d4e2);position:relative;overflow:hidden;flex:none;display:grid;place-items:center;color:rgba(20,23,26,.25)}.room .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.room .tx{flex:1;min-width:0}.room h3{font-size:16px}.room .meta{display:flex;gap:10px;color:var(--mut);font-size:12px;margin-top:6px;flex-wrap:wrap}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:240px;background:linear-gradient(135deg,#dfe6ee,#c9d4e2)}.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.gal .ph{flex:none;width:100%;display:grid;place-items:center;color:rgba(20,23,26,.25)}.gal .ph svg{width:60px;height:60px}
.am{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.am div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);text-align:center;padding:8px 2px;border:1px solid var(--line);border-radius:12px;background:#fff}
.am svg{width:22px;height:22px;color:var(--ink2)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#e8eaec;border-radius:13px;padding:4px;margin-bottom:6px}
.seg button{padding:11px;border-radius:10px;font-weight:700;color:var(--mut)}.seg button.on{background:var(--o);color:#fff}

/* profile */
.avatar{width:76px;height:76px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:700;overflow:hidden;margin:0 auto 8px}.avatar img{width:100%;height:100%;object-fit:cover}
.mrow{display:flex;align-items:center;gap:14px;padding:15px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line);background:#fff}
.mrow:first-child{border-radius:14px 14px 0 0}.mrow:last-child{border:0;border-radius:0 0 14px 14px}
.mrow .ic{color:var(--ink2)}.mrow .go{margin-left:auto;color:var(--mut)}
.mlist{border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:12.5px;margin:16px 0 4px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.bk{padding:14px}.bk+.bk{margin-top:12px}
.bk .hd2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

/* receipt */
.rcpt{background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px 20px;box-shadow:var(--sh);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#111}
.rcpt .h{text-align:center;border-bottom:1px dashed #999;padding-bottom:10px;margin-bottom:10px}.rcpt .h b{font:800 18px Inter,sans-serif;display:block}
.rcpt .paid{display:inline-block;margin-top:8px;border:2px solid var(--ok);color:var(--ok);font-weight:800;letter-spacing:.14em;padding:2px 12px;border-radius:6px;transform:rotate(-3deg)}
.rcpt .r{display:flex;justify-content:space-between;gap:10px;padding:2px 0}.rcpt .r.s{font-weight:800;font-size:15px;border-top:1px solid #111;margin-top:6px;padding-top:7px}
.rcpt .li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:2px 0}.rcpt .li small{display:block;opacity:.65}
.rcpt hr{border:0;border-top:1px dashed #999;margin:10px 0}.rcpt .ft{text-align:center;margin-top:12px;opacity:.75}
#map{height:210px;border-radius:14px;margin-top:8px;border:1px solid var(--line);z-index:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 90px);background:#14171A;color:#fff;padding:12px 18px;border-radius:14px;z-index:90;font-size:14px;box-shadow:0 10px 28px rgba(0,0,0,.3);max-width:90vw;display:flex;gap:9px;align-items:center}.toast.bad{background:var(--bad)}
/* install-app prompt */
.pwa{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom));width:min(456px,calc(100% - 24px));z-index:45;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 34px rgba(20,23,26,.22);padding:14px;animation:pwaup .35s ease}
@keyframes pwaup{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.pwa .pr{display:flex;gap:12px;align-items:center}
.pwa .pi{width:46px;height:46px;border-radius:12px;background:var(--o);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;overflow:hidden;flex:none}
.pwa .pi img{width:100%;height:100%;object-fit:cover}
.pwa b{font-size:15px}.pwa .pt{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.4}
.pwa .pb{display:flex;gap:8px;margin-top:12px}.pwa .pb .btn{flex:1}
.banner{display:none;background:#fff;border:1px solid var(--line);border-radius:14px;margin:12px 16px 0;padding:12px;align-items:center;gap:10px}
/* grab handle + bigger close target so a sheet can never trap the guest */
.sheet:before{content:"";display:block;width:42px;height:4px;border-radius:9px;background:#d5d9dd;margin:8px auto 0;flex:none}
.x{width:42px;height:42px}
.bkcta{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#1f2937,#374151);color:#fff;border-radius:var(--r);padding:16px;margin-top:16px;width:100%;text-align:left;box-shadow:var(--sh)}
.bkcta .bi{width:46px;height:46px;border-radius:13px;background:var(--o);display:grid;place-items:center;flex:none}.bkcta small{opacity:.8;display:block}
@media print{body>*:not(#printarea){display:none!important}#printarea{display:block!important}}
#printarea{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- payment ---------- */

    $('#pay').innerHTML = DT.method === 'MPESA' ? 'Pay with M-PESA · ' + money(total) : 'Place order · ' + money(total);
  }
  $$('.method').forEach(function (m) { m.onclick = function () { DT.method = m.dataset.m; paint(); }; }); paint();

    btn.disabled = true; btn.textContent = 'Placing your order…'; if (!DT.ref) DT.ref = 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    var o;
    try {
      o = await call('/delivery', 'POST', { branchId: branchId || undefined, name: DT.name, phone: DT.phone, address: DT.address, landmark: DT.landmark || undefined, instructions: DT.ins || undefined, lat: DT.pin.lat, lng: DT.pin.lng, clientRef: DT.ref, payMethod: DT.method,
        items: cart.map(function (c) { return { menuItemId: c.id, quantity: c.qty, variantId: c.vid || undefined, notes: c.notes || undefined, modifiers: c.mods.length ? c.mods.map(function (x) { return { groupId: x.groupId, optionId: x.optionId }; }) : undefined }; }) });

async function payOrder(o) {
  var phone = DT.mpesaPhone || DT.phone;
  try { var p = await call('/delivery/' + o.trackKey + '/pay', 'POST', { payerPhone: phone }); waitPay(p.reference, { amount: p.amount, onOk: function () { stack = []; cur = { v: 'confirmed', p: { key: o.trackKey, paid: true } }; render(); }, onClose: function () { stack = []; cur = { v: 'track', p: { key: o.trackKey } }; render(); } }); }
  catch (e) { toast(e.message, true); stack = []; cur = { v: 'track', p: { key: o.trackKey } }; render(); }

/* STK push waiting sheet, shared by delivery orders, table bookings and room deposits */
function waitPay(ref, o) {
  var n = 0, max = 45, done = false;
  var m = sheet('<div class="bd center" style="padding-top:26px"><div class="phone-anim">' + ic('phone') + '</div><h2>Check your phone</h2><p class="muted" style="margin:6px 0 0">Enter your M-PESA PIN to pay <b>' + money(o.amount) + '</b>.</p><div class="prog"><i id="pg"></i></div><p class="fine" id="wm" style="margin-top:10px">Waiting for payment…</p></div><div class="fx"><button class="btn ghost" id="wc">Close</button></div>', null, true);
  $('#wc', m).onclick = function () { done = true; clearInterval(t); closeSheet(); if (o.onClose) o.onClose(); };
  var t = setInterval(async function () {
    if (done) return; n++; var pg = $('#pg', m); if (pg) pg.style.width = Math.min(100, n / max * 100) + '%';
    try {
      var s = await call('/pay/' + ref);
      if (s.status === 'SUCCESS' && (s.settled || n > 3)) { done = true; clearInterval(t); paySuccess(ref, s, o); }
      else if (s.status === 'FAILED' || s.status === 'CANCELLED') { done = true; clearInterval(t); payFail(s.message || 'The payment was not completed.', o); }
      else if (n > max) { done = true; clearInterval(t); payFail('We are still waiting. If you already paid, it will be confirmed shortly - check My Orders.', o, true); }
    } catch (e) { if (n > max) { done = true; clearInterval(t); payFail(e.message, o, true); } }
  }, 3500);
}
function paySuccess(ref, s, o) {
  sheet('<div class="bd center" style="padding-top:24px"><div class="okring">' + ic('check') + '</div><h2>Payment received</h2><p class="muted" style="margin:6px 0 0">' + (s.receipt ? 'M-PESA ' + E(s.receipt) : 'Thank you!') + '</p></div><div class="fx"><button class="btn ghost" id="vr">' + ic('receipt') + ' Receipt</button><button class="btn" id="dn">Continue</button></div>', function (m) {
    $('#dn', m).onclick = function () { closeSheet(); if (o.onOk) o.onOk(); }; $('#vr', m).onclick = function () { closeSheet(); if (o.onOk) o.onOk(); setTimeout(function () { nav('receipt', { ref: ref }); }, 30); };
  }, true);
  loadHist();
}
function payFail(msg, o, wait) {
  sheet('<div class="bd center" style="padding-top:24px"><div class="okring" style="background:' + (wait ? 'var(--warn)' : 'var(--bad)') + '">' + ic(wait ? 'clock' : 'x') + '</div><h2>' + (wait ? 'Still waiting' : 'Payment not completed') + '</h2><p class="muted" style="margin:6px 0 0">' + E(msg) + '</p></div><div class="fx"><button class="btn ghost" id="cl">Close</button>' + (o.retry ? '<button class="btn" id="rt">Try again</button>' : '') + '</div>', function (m) {
    $('#cl', m).onclick = function () { closeSheet(); if (o.onClose) o.onClose(); }; var r = $('#rt', m); if (r) r.onclick = function () { closeSheet(); o.retry(); };
  }, true);
}
/* ask which number to pay with, then run an action that returns {reference, amount} */
function payPrompt(title, amount, phone, startFn, o) {
  sheet(shd(title) + '<div class="bd"><div class="card" style="background:var(--ol);border-color:#fbd5bd"><div class="tot" style="padding:0"><span>Amount to pay</span><b style="font-size:20px">' + money(amount) + '</b></div></div><label class="lbl">M-PESA number<div class="phonef"><span>+254</span><input id="pp" type="tel" inputmode="numeric" placeholder="712 345 678" value="' + E(localPhone(phone)) + '"></div></label><div class="fine" style="margin-top:8px">You will get a prompt on your phone to enter your M-PESA PIN.</div><div class="err" id="er"></div></div><div class="fx"><button class="btn ghost" data-close>Cancel</button><button class="btn green" id="go">' + ic('phone') + ' Send M-PESA prompt</button></div>', function (m) {
    $('#go', m).onclick = async function () {
      var b = this, v = localPhone($('#pp', m).value); if (v.length !== 9) return $('#er', m).textContent = 'Enter a valid Safaricom number.';
      b.disabled = true; b.textContent = 'Sending…';
      try { var r = await startFn('0' + v); closeSheet(); waitPay(r.reference, { amount: r.amount || amount, onOk: o.onOk, onClose: o.onClose, retry: function () { payPrompt(title, amount, '0' + v, startFn, o); } }); }
      catch (e) { b.disabled = false; b.innerHTML = ic('phone') + ' Send M-PESA prompt'; $('#er', m).textContent = e.message; }
    };
  });
}

var STEPS = [['RECEIVED', 'Order Received', 'Your order has been received.'], ['PREPARING', 'Preparing', 'The kitchen is preparing your meal.'], ['READY', 'Ready to Serve', 'Waiting for the rider.'], ['ON_THE_WAY', 'On the way', 'Your rider is on the way.'], ['DELIVERED', 'Delivered', 'Enjoy your meal!']];
VIEWS.track = function (p) {

  var load = async function () {
    try {
      var o = await call('/delivery/' + p.key); if (cur.v !== 'track') return;
      var bad = o.stage === 'CANCELLED' || o.stage === 'FAILED', wait = o.stage === 'AWAITING_PAYMENT';

      var h = '<div class="obanner" style="margin-top:14px"><div><b>Order ' + E(o.orderNumber) + '</b><small>' + o.items.length + ' item' + (o.items.length > 1 ? 's' : '') + ' · ' + money(o.total) + '</small></div><small>' + ftime(o.placedAt) + '</small></div>';
      if (wait) h += '<div class="card" style="margin-top:12px;border-color:#fbd5bd;background:var(--ol)"><b>Payment needed</b><p class="muted" style="margin:4px 0 12px;font-size:13.5px">' + E(o.message) + '</p><button class="btn" id="pn">Pay ' + money(o.pay.amountDue) + ' with M-PESA</button></div>';

      h += '<div class="card"><b>Items</b>' + o.items.map(function (i) { return '<div class="row fine" style="padding:6px 0;color:var(--ink2)"><b style="color:var(--o)">' + i.quantity + '×</b><span class="grow">' + E(i.name) + '</span>' + (i.total != null ? '<span>' + money(i.total) + '</span>' : '') + '</div>'; }).join('') + '<div class="row fine" style="margin-top:6px">' + ic('pin') + '<span class="grow">' + E(o.address) + '</span></div><div class="row" style="margin-top:6px"><span class="grow fine">' + (o.pay.state === 'PAID' ? (o.pay.method === 'CASH' ? 'Paid on delivery' : 'Paid with M-PESA') : o.pay.state === 'COD' ? 'Pay the rider on delivery' : '') + '</span>' + (o.pay.state === 'PAID' ? '<span class="tag gr">Paid</span>' : '') + '</div></div>';
      if (o.pay.receiptRef) h += '<button class="btn ghost" id="vr">' + ic('receipt') + ' View e-receipt</button>';
      $('#t').innerHTML = h;
      var pn = $('#pn'); if (pn) pn.onclick = function () { payPrompt('Pay for your order', o.pay.amountDue, DT.mpesaPhone || DT.phone || (acct && acct.account.phone), async function (ph) { return call('/delivery/' + p.key + '/pay', 'POST', { payerPhone: ph }); }, { onOk: function () { VIEWS.track(p); }, onClose: function () { VIEWS.track(p); } }); };

    var html = receiptHtml(r); v.innerHTML = top('E-Receipt', { right: '<button class="ib" id="pr" aria-label="Print">' + ic('print') + '</button>' }) + '<div class="pad" style="padding-top:18px">' + html + '</div>';
    $('#pr').onclick = function () { $('#printarea').innerHTML = html; window.print(); };
  } catch (e) { v.innerHTML = top('E-Receipt') + '<div class="pad">' + empty('receipt', 'Receipt not found', E(e.message)) + '</div>'; }
};
function receiptHtml(r) {
  var row = function (a, b) { return b == null || b === '' ? '' : '<div class="r"><span>' + a + '</span><span>' + b + '</span></div>'; };
  var b = r.business || {}; var n = function (x) { return x == null ? '' : money(x); };
  return '<div class="rcpt"><div class="h"><b>' + E(b.name || '') + '</b>' + (b.address ? E(b.address) + '<br>' : '') + (b.phone ? E(b.phone) + '<br>' : '') + (b.taxPin ? 'PIN ' + E(b.taxPin) : '') + '<div class="paid">PAID</div></div>' +
    row('Receipt', E(r.number)) + row('Date', E(new Date(r.date).toLocaleString('en-KE'))) + row('For', E(r.place)) + (r.mpesaReceipt ? row('M-PESA', E(r.mpesaReceipt)) : '') + '<hr>' +
    (r.lines || []).map(function (l) { return '<div class="li"><b>' + E(l.quantity) + '×</b><span>' + E(l.name) + (l.note ? '<small>' + E(l.note) + '</small>' : '') + '</span><span>' + n(l.total) + '</span></div>'; }).join('') + '<hr>' +
    (r.itemsTotal != null ? row('Items', n(r.itemsTotal)) : '') + (r.serviceCharge ? row('Service charge', n(r.serviceCharge)) : '') + (r.tax ? row('VAT included', n(r.tax)) : '') + '<div class="r s"><span>TOTAL</span><span>' + n(r.total) + '</span></div>' + row('Paid', n(r.paidAmount)) +
    (r.payments || []).map(function (x) { return row(E(x.method || 'M-PESA'), n(x.amount)); }).join('') + '<div class="ft">' + E(r.footer || 'Thank you!') + '</div></div>';
}

/* ---------- account: auth, profile, settings ---------- */
VIEWS.auth = function (p) {
  var reg = !!p.reg, h = top(reg ? 'Create account' : 'Sign in') + '<div class="pad"><div style="text-align:center;margin:22px 0 14px">' + logoHtml('lg2').replace('class="lg2"', 'style="width:64px;height:64px;border-radius:18px;background:var(--o);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;margin:0 auto 10px;overflow:hidden"') + '<h2>' + E(ctx.business.name) + '</h2>' + (p.why ? '<p class="muted" style="margin-top:6px;font-size:14px">' + E(p.why) + '</p>' : '<p class="muted" style="margin-top:6px;font-size:14px">One account for ordering, bookings and receipts.</p>') + '</div>' +
    '<div class="seg"><button data-m="in" class="' + (reg ? '' : 'on') + '">Sign in</button><button data-m="up" class="' + (reg ? 'on' : '') + '">Create account</button></div><div class="card">' +
    (reg ? '<label class="lbl" style="margin-top:0">Full name<input class="field" id="a1" autocomplete="name"></label><label class="lbl">Phone<input class="field" id="a2" type="tel" placeholder="0712 345 678" autocomplete="tel"></label><label class="lbl">Email (optional)<input class="field" id="a3" type="email" autocomplete="email"></label><label class="lbl">Password<input class="field" id="a4" type="password" autocomplete="new-password" placeholder="At least 6 characters"></label>' :
      '<label class="lbl" style="margin-top:0">Email or phone<input class="field" id="a1" autocomplete="username" placeholder="you@email.com or 0712 345 678"></label><label class="lbl">Password<input class="field" id="a4" type="password" autocomplete="current-password"></label>') +
    '<div class="err" id="er"></div><button class="btn" id="sb" style="margin-top:8px">' + (reg ? 'Create account' : 'Sign in') + '</button><div id="gwrap" hidden><div class="or">or</div><div id="gbtn" style="display:flex;justify-content:center"></div></div></div></div>';
  $('#view').innerHTML = h; $$('[data-m]').forEach(function (b) { b.onclick = function () { VIEWS.auth(Object.assign({}, p, { reg: b.dataset.m === 'up' })); }; });
  var done = async function (res) { setAcct(res); await loadHist(); toast('Welcome, ' + String(res.account.name).split(' ')[0]); var f = p.after; cur = stack.pop() || { v: 'home', p: {} }; render(); if (f) f(); };
  $('#sb').onclick = async function () {
    var er = $('#er'), b = this; er.textContent = ''; b.disabled = true;
    try {
      if (reg) { var nm = $('#a1').value.trim(), ph = $('#a2').value.trim(), em = $('#a3').value.trim(), pw = $('#a4').value; if (nm.length < 2) throw new Error('Enter your name'); if (!ph && !em) throw new Error('Add a phone number or an email'); if (pw.length < 6) throw new Error('Password must be at least 6 characters'); await done(await call('/account/register', 'POST', { name: nm, phone: ph || undefined, email: em || undefined, password: pw })); }
      else { var id = $('#a1').value.trim(), pw2 = $('#a4').value; if (!id || !pw2) throw new Error('Enter your email or phone, and password'); await done(await call('/account/login', 'POST', { identifier: id, password: pw2 })); }
    } catch (e) { er.textContent = e.message; b.disabled = false; }
  };
  var gid = ctx.googleClientId || (window.APP_CONFIG && window.APP_CONFIG.GOOGLE_CLIENT_ID);
  if (gid) { var go = function () { try { window.google.accounts.id.initialize({ client_id: gid, callback: async function (resp) { try { await done(await call('/account/google', 'POST', { credential: resp.credential })); } catch (e) { toast(e.message, true); } } }); window.google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large', shape: 'pill', text: reg ? 'signup_with' : 'continue_with', width: 300 }); $('#gwrap').hidden = false; } catch (e) { /* google unavailable */ } };
    if (window.google && window.google.accounts) go(); else { var sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true; sc.onload = go; document.head.appendChild(sc); } }
};
VIEWS.more = async function () {
  var a = acct && acct.account, n = activeOrders();
  var row = function (i, t, g, x) { return '<button class="mrow" data-g="' + g + '"><span class="ic">' + ic(i) + '</span><span class="grow">' + t + '</span>' + (x || '') + '<span class="go">' + ic('chev') + '</span></button>'; };
  var h = top('Profile', { noBack: true }) + '<div class="pad" style="padding-top:20px"><div class="center"><div class="avatar">' + (a ? (a.picture ? '<img alt="" src="' + E(a.picture) + '">' : E(initials(a.name))) : ic('user')) + '</div><h2>' + (a ? E(a.name) : 'Welcome') + '</h2><div class="fine">' + (a ? E(a.email || (a.phone ? '+254 ' + localPhone(a.phone) : '')) : 'Sign in to track orders and bookings') + '</div></div><div class="sp"></div>';
  if (!a) h += '<button class="btn" id="si">Sign in / Create account</button><div class="sp"></div>';
  h += '<div class="mlist">' + row('cal', 'My Bookings', 'bookings') + row('receipt', 'My Orders', 'orders', n ? '<span class="tag or">' + n + ' active</span>' : '') + row('receipt', 'E-Receipts', 'receipts') + row('table', 'Book a table', 'tables') + (ctx.rooms.enabled ? row('bed', 'Book accommodation', 'rooms') : '') + (ctx.business.phone ? '<a class="mrow" href="tel:' + E(ctx.business.phone) + '" style="color:inherit;text-decoration:none"><span class="ic">' + ic('help') + '</span><span class="grow">Help &amp; Support</span><span class="fine">' + E(ctx.business.phone) + '</span></a>' : '') + (a ? row('gear', 'Settings', 'settings') : '') + (a ? '<button class="mrow" id="lo" style="color:var(--bad)"><span class="ic" style="color:var(--bad)">' + ic('logout') + '</span><span class="grow">Log Out</span></button>' : '') + '</div>' +
    '<div class="fine center" style="margin:22px 0">' + E(ctx.business.name) + '<br>Secure ordering and M-PESA payments</div></div>';
  $('#view').innerHTML = h; var si = $('#si'); if (si) si.onclick = function () { nav('auth', {}); };
  $$('[data-g]').forEach(function (b) { b.onclick = function () { var g = b.dataset.g; if (g === 'orders' || g === 'rooms') tab(g); else nav(g); }; });
  var lo = $('#lo'); if (lo) lo.onclick = function () { acct = null; hist = null; ss('q.acct', null); toast('Signed out'); tab('home'); };
};
VIEWS.settings = function () {
  var a = acct && acct.account; if (!a) return nav('auth', {}, { replace: true });
  $('#view').innerHTML = top('Settings') + '<div class="pad"><div class="card" style="margin-top:14px"><label class="lbl" style="margin-top:0">Full name<input class="field" id="s1" value="' + E(a.name) + '"></label><label class="lbl">Phone (also your default M-PESA number)<input class="field" id="s2" type="tel" value="' + E(a.phone || '') + '"></label><label class="lbl">Email' + (a.google ? ' (from Google)' : '') + '<input class="field" id="s3" type="email" value="' + E(a.email || '') + '"' + (a.google ? ' disabled' : '') + '></label>' +
    (a.google ? '' : '<div class="sec" style="margin:18px 0 0">Change password (optional)</div><label class="lbl">Current password<input class="field" id="s4" type="password" autocomplete="current-password"></label><label class="lbl">New password<input class="field" id="s5" type="password" autocomplete="new-password"></label>') + '<div class="err" id="er"></div><button class="btn" id="sv" style="margin-top:8px">Save changes</button></div></div>';
  $('#sv').onclick = async function () {
    var er = $('#er'), b = this; er.textContent = ''; var body = { name: $('#s1').value.trim(), phone: $('#s2').value.trim() };
    if (!a.google) { body.email = $('#s3').value.trim(); var np = $('#s5').value; if (np) { if (np.length < 6) return er.textContent = 'New password must be at least 6 characters'; body.newPassword = np; body.currentPassword = $('#s4').value; } }
    b.disabled = true;
    try { var r = await call('/account/profile', 'PUT', body); acct.account = r.account; ss('q.acct', acct); DT.name = r.account.name; DT.phone = r.account.phone || ''; toast('Saved'); back(); } catch (e) { er.textContent = e.message; b.disabled = false; }
  };
};

function syncAcct() { var a = sg('q.acct'); if (a && a.token && (!acct || acct.token !== a.token)) { acct = a; try { drawNav(); if (MAIN.indexOf(cur.v) >= 0) render(); } catch (e) { /* ignore */ } } }
window.addEventListener('pageshow', syncAcct);
window.addEventListener('storage', function (e) { if (e.key === 'q.acct') syncAcct(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) syncAcct(); });
init();
})();
</script>
