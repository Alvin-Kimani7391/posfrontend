<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reset password · Six Star POS</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f766e" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
</head>
<body>
  <div class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo"><span class="logo-mark" id="logo-mark"></span><span id="app-name">Six Star POS</span></div>
      <h1 id="page-title">Set a new password</h1>
      <p class="auth-subtitle" id="page-sub">Choose a new password for your account.</p>
      <div id="form-alert-slot"></div>
      <form id="reset-form" novalidate>
        <div class="field" id="pw-fields">
          <label for="new-password">New password</label>
          <input class="input" type="password" id="new-password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" />
          <label for="confirm-password" style="margin-top:var(--space-3)">Confirm password</label>
          <input class="input" type="password" id="confirm-password" placeholder="Repeat password" autocomplete="new-password" />
        </div>
        <div class="field hidden" id="pin-fields">
          <label for="new-pin">New PIN (4 to 8 digits)</label>
          <input class="input" type="password" id="new-pin" placeholder="••••" inputmode="numeric" maxlength="8" autocomplete="off" />
          <label for="confirm-pin" style="margin-top:var(--space-3)">Confirm PIN</label>
          <input class="input" type="password" id="confirm-pin" placeholder="••••" inputmode="numeric" maxlength="8" autocomplete="off" />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="reset-btn">Save</button>
      </form>
      <div id="done" class="hidden">
        <a class="btn btn-primary btn-block btn-lg" id="done-link" href="login.html">Go to log in</a>
      </div>
      <div class="auth-footer" id="foot"><a href="login.html">Back to log in</a></div>
    </div>
  </div>
  <script src="js/core/config.js"></script>
  <script src="js/core/icons.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/pages/reset-password.js"></script>
</body>
</html>
